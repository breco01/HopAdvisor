spring.application.name=backend
hopadvisor.openai.api-key=${OPENAI_API_KEY:}
hopadvisor.openai.model=gpt-4o-mini
hopadvisor.openai.temperature=0.7
hopadvisor.ai.enabled=true

# H2 database (dev)
spring.datasource.url=jdbc:h2:mem:hopadvisordb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console (optioneel)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


